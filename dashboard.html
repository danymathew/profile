<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Financial Dashboard - Dany & Clair</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --ink: #2c3e50;
    --ink-soft: #5a6b7a;
    --line: #e6e9ec;
    --accent: #16a085;
    --accent-dim: #d9f2ec;
    --danger: #c0392b;
    --up: #16a085;
    --down: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background-color: var(--bg);
    color: #333;
    margin: 0;
    padding: 24px;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header h1 {
    margin: 0;
    font-size: 2.3em;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  header p {
    margin: 6px 0 0;
    color: var(--ink-soft);
  }
  .wrap {
    max-width: 900px;
    margin: 0 auto;
  }
  .period-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }
  .period-bar label {
    font-size: 0.85em;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .period-bar select {
    font-family: inherit;
    font-size: 0.95em;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid #d5dade;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  .vs-note {
    font-size: 0.8em;
    color: var(--ink-soft);
  }
  .section {
    background: var(--card);
    padding: 22px 24px;
    margin-bottom: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 6px;
  }
  .section h2 {
    margin: 0;
    color: var(--ink);
    font-size: 1.25em;
  }
  .target {
    font-size: 0.85em;
    color: var(--ink-soft);
    background: #f0f2f4;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .target.met { background: var(--accent-dim); color: var(--accent); }
  .progress-track {
    height: 6px;
    background: #eef1f3;
    border-radius: 4px;
    margin: 10px 0 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width .4s ease;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
  }
  th, td {
    padding: 9px 6px;
    border-bottom: 1px solid var(--line);
    text-align: left;
  }
  th {
    font-size: 0.82em;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    font-weight: 600;
  }
  td.amount, th.amount-h { text-align: right; }
  tr:last-child td { border-bottom: none; }
  .total-row {
    display: flex;
    justify-content: flex-end;
    align-items: baseline;
    gap: 10px;
    margin-top: 10px;
  }
  .total {
    text-align: right;
    font-weight: bold;
    font-size: 1.15em;
    color: var(--ink);
  }
  .delta {
    font-size: 0.82em;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .delta.up { color: var(--up); background: var(--accent-dim); }
  .delta.down { color: var(--down); background: #fbe6e3; }
  .delta.flat { color: var(--ink-soft); background: #eef1f3; }
  .highlight { color: var(--accent); font-weight: 600; }
  .empty-note {
    color: var(--ink-soft);
    font-style: italic;
    font-size: 0.95em;
    margin: 4px 0 0;
  }
  .list-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  .list-row:last-child { border-bottom: none; }
  .grand {
    background: linear-gradient(135deg, #1c2b36, #24404a);
    color: #fff;
  }
  .grand h2 { color: #fff; }
  .grand .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    font-size: 1.05em;
  }
  .grand .row:last-child { border-bottom: none; }
  .grand .row .val-group { display: flex; align-items: baseline; gap: 8px; }
  .grand .row .val { font-weight: 700; color: #7fe0c4; }
  .grand .delta.up { color: #7fe0c4; background: rgba(127,224,196,0.15); }
  .grand .delta.down { color: #ff9d90; background: rgba(255,157,144,0.15); }
  .grand .delta.flat { color: #b7c4cc; background: rgba(183,196,204,0.12); }
  .error-box {
    background: #fdecea;
    border: 1px solid #f5c6c0;
    color: var(--danger);
    padding: 16px 20px;
    border-radius: 8px;
    max-width: 900px;
    margin: 0 auto 20px;
  }
  .error-box code {
    background: rgba(0,0,0,0.06);
    padding: 1px 6px;
    border-radius: 4px;
  }
  footer {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.8em;
    margin-top: 24px;
  }
  @media (max-width: 560px) {
    body { padding: 14px; }
    header h1 { font-size: 1.7em; }
    .section { padding: 16px; }
  }
</style>

<script>
/* ---------------- Formatting helpers ---------------- */

function formatINR(n) {
  if (n === null || n === undefined || isNaN(n)) return "₹0";
  const isNeg = n < 0;
  n = Math.abs(Math.round(n));
  const s = n.toString();
  let last3 = s.substring(s.length - 3);
  let rest = s.substring(0, s.length - 3);
  if (rest !== "") last3 = "," + last3;
  const formatted = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + last3;
  return (isNeg ? "-₹" : "₹") + formatted;
}

function formatPeriod(period) {
  const [y, m] = period.split("-");
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const idx = parseInt(m, 10) - 1;
  return (months[idx] || m) + " " + y;
}

function sectionTotal(section) {
  if (section.type === "table") {
    return section.rows.reduce((sum, r) => sum + (r.amount || 0), 0);
  }
  if (section.type === "single") {
    return section.amount || 0;
  }
  if (section.type === "list") {
    return section.items.reduce((sum, i) => sum + (i.amount || 0), 0);
  }
  return 0;
}

function deltaBadge(current, previous) {
  if (previous === null || previous === undefined) return "";
  const diff = current - previous;
  if (diff === 0) return `<span class="delta flat">no change</span>`;
  const cls = diff > 0 ? "up" : "down";
  const arrow = diff > 0 ? "▲" : "▼";
  return `<span class="delta ${cls}">${arrow} ${formatINR(Math.abs(diff))}</span>`;
}

/* ---------------- Rendering ---------------- */

function renderSectionHeader(section, total) {
  const head = document.createElement("div");
  head.className = "section-head";

  const h2 = document.createElement("h2");
  h2.textContent = `${section.id}. ${section.title}`;
  head.appendChild(h2);

  if (section.target) {
    const met = total >= section.target;
    const badge = document.createElement("span");
    badge.className = "target" + (met ? " met" : "");
    badge.textContent = `Target: ${formatINR(section.target)}`;
    head.appendChild(badge);
  }
  return head;
}

function renderProgress(section, total) {
  if (!section.target) return null;
  const track = document.createElement("div");
  track.className = "progress-track";
  const fill = document.createElement("div");
  fill.className = "progress-fill";
  const pct = Math.min(100, Math.max(0, (total / section.target) * 100));
  fill.style.width = pct.toFixed(1) + "%";
  track.appendChild(fill);
  return track;
}

function renderTotalRow(total, prevTotal) {
  const row = document.createElement("div");
  row.className = "total-row";
  const totalP = document.createElement("span");
  totalP.className = "total";
  totalP.textContent = "Total: " + formatINR(total);
  row.appendChild(totalP);
  if (prevTotal !== null && prevTotal !== undefined) {
    const badge = document.createElement("span");
    badge.innerHTML = deltaBadge(total, prevTotal);
    row.appendChild(badge.firstChild);
  }
  return row;
}

function renderTableSection(section, prevTotal) {
  const wrap = document.createElement("div");
  wrap.className = "section";
  const total = sectionTotal(section);

  wrap.appendChild(renderSectionHeader(section, total));
  const prog = renderProgress(section, total);
  if (prog) wrap.appendChild(prog);

  const table = document.createElement("table");
  const thead = document.createElement("tr");
  section.columns.forEach(col => {
    const th = document.createElement("th");
    th.textContent = col.label;
    if (col.isAmount) th.className = "amount-h";
    thead.appendChild(th);
  });
  table.appendChild(thead);

  section.rows.forEach(row => {
    const tr = document.createElement("tr");
    section.columns.forEach(col => {
      const td = document.createElement("td");
      if (col.isAmount) {
        td.className = "amount";
        td.textContent = formatINR(row[col.key]);
      } else {
        td.textContent = row[col.key];
      }
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
  wrap.appendChild(table);
  wrap.appendChild(renderTotalRow(total, prevTotal));

  return wrap;
}

function renderSingleSection(section, prevTotal) {
  const wrap = document.createElement("div");
  wrap.className = "section";
  const total = sectionTotal(section);

  wrap.appendChild(renderSectionHeader(section, total));
  const prog = renderProgress(section, total);
  if (prog) wrap.appendChild(prog);

  const p = document.createElement("p");
  p.innerHTML = `${section.label}: <span class="highlight">${formatINR(section.amount)}</span>`;
  wrap.appendChild(p);
  wrap.appendChild(renderTotalRow(total, prevTotal));

  return wrap;
}

function renderListSection(section, prevTotal) {
  const wrap = document.createElement("div");
  wrap.className = "section";
  const total = sectionTotal(section);

  wrap.appendChild(renderSectionHeader(section, total));

  if (section.items.length === 0) {
    const note = document.createElement("p");
    note.className = "empty-note";
    note.textContent = "No outstanding entries.";
    wrap.appendChild(note);
    return wrap;
  }

  section.items.forEach(item => {
    const row = document.createElement("div");
    row.className = "list-row";
    row.innerHTML = `<span>${item.label}</span><span class="highlight">${formatINR(item.amount)}</span>`;
    wrap.appendChild(row);
  });
  wrap.appendChild(renderTotalRow(total, prevTotal));

  return wrap;
}

function renderSection(section, prevTotal) {
  if (section.type === "table") return renderTableSection(section, prevTotal);
  if (section.type === "single") return renderSingleSection(section, prevTotal);
  if (section.type === "list") return renderListSection(section, prevTotal);
  return document.createElement("div");
}

let DATA = null;

function getSortedSnapshots() {
  return [...DATA.snapshots].sort((a, b) => a.period.localeCompare(b.period));
}

function getPrevSnapshot(period) {
  const sorted = getSortedSnapshots();
  const idx = sorted.findIndex(s => s.period === period);
  return idx > 0 ? sorted[idx - 1] : null;
}

function renderPeriod(period) {
  const snapshot = DATA.snapshots.find(s => s.period === period);
  if (!snapshot) return;
  const prevSnapshot = getPrevSnapshot(period);
  const prevTotalsById = {};
  if (prevSnapshot) {
    prevSnapshot.sections.forEach(s => { prevTotalsById[s.id] = sectionTotal(s); });
  }

  document.getElementById("dashTitle").textContent = DATA.meta.title;
  document.getElementById("dashSubtitle").textContent = DATA.meta.subtitle;
  document.getElementById("dashUpdated").textContent = "Last update: " + snapshot.lastUpdated;

  const vsNote = document.getElementById("vsNote");
  vsNote.textContent = prevSnapshot ? `vs. ${formatPeriod(prevSnapshot.period)}` : "no prior month to compare";

  const container = document.getElementById("sections");
  container.innerHTML = "";
  const totalsById = {};

  snapshot.sections.forEach(section => {
    const total = sectionTotal(section);
    totalsById[section.id] = total;
    const prevTotal = prevSnapshot ? (prevTotalsById[section.id] !== undefined ? prevTotalsById[section.id] : null) : null;
    container.appendChild(renderSection(section, prevTotal));
  });

  // Grand totals: sum of core asset-building sections only (1-6).
  // Sections 7 (receivables) and 8 (liabilities) are tracked separately.
  const assetSectionIds = [1, 2, 3, 4, 5, 6];
  const totalAssets = assetSectionIds.reduce((sum, id) => sum + (totalsById[id] || 0), 0);
  const liquidCash = (totalsById[1] || 0) + (totalsById[2] || 0) + (totalsById[3] || 0);
  const receivables = totalsById[7] || 0;
  const liabilities = totalsById[8] || 0;
  const netPosition = totalAssets + receivables - liabilities;

  let prevTotalAssets = null, prevLiquidCash = null, prevReceivables = null, prevLiabilities = null, prevNetPosition = null;
  if (prevSnapshot) {
    prevTotalAssets = assetSectionIds.reduce((sum, id) => sum + (prevTotalsById[id] || 0), 0);
    prevLiquidCash = (prevTotalsById[1] || 0) + (prevTotalsById[2] || 0) + (prevTotalsById[3] || 0);
    prevReceivables = prevTotalsById[7] || 0;
    prevLiabilities = prevTotalsById[8] || 0;
    prevNetPosition = prevTotalAssets + prevReceivables - prevLiabilities;
  }

  const grandRow = (label, val, prev) => `
    <div class="row">
      <span>${label}</span>
      <span class="val-group"><span class="val">${formatINR(val)}</span>${deltaBadge(val, prev)}</span>
    </div>`;

  const grand = document.getElementById("grandTotals");
  grand.innerHTML =
    grandRow("Total of All Assets (Sections 1–6)", totalAssets, prevTotalAssets) +
    grandRow("Liquid Cash (Fixed Deposits + Savings + Stocks)", liquidCash, prevLiquidCash) +
    grandRow("Payments to Receive", receivables, prevReceivables) +
    grandRow("Credit Card Outstanding", liabilities, prevLiabilities) +
    grandRow("Net Position (Assets + Receivables − Liabilities)", netPosition, prevNetPosition);

  document.getElementById("grandCard").style.display = "";
}

function setupPeriodSelector() {
  const sorted = getSortedSnapshots();
  const bar = document.getElementById("periodBar");
  const select = document.getElementById("periodSelect");

  if (sorted.length <= 1) {
    bar.style.display = sorted.length === 1 ? "flex" : "none";
    document.getElementById("periodSelect").style.display = sorted.length <= 1 ? "none" : "";
    if (sorted.length === 1) {
      document.getElementById("vsNote").textContent = "";
    }
  } else {
    bar.style.display = "flex";
  }

  select.innerHTML = "";
  sorted.slice().reverse().forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.period;
    opt.textContent = formatPeriod(s.period);
    select.appendChild(opt);
  });

  select.addEventListener("change", () => renderPeriod(select.value));

  const latest = sorted[sorted.length - 1];
  select.value = latest.period;
  renderPeriod(latest.period);
}

function showError(err) {
  const box = document.getElementById("errorSlot");
  box.innerHTML = `
    <div class="error-box">
      <strong>Couldn't load dashboard data.</strong><br>
      The embedded data block is missing, not valid JSON, or has no snapshots.<br><br>
      <span style="font-size:0.85em; opacity:0.8;">Details: ${err}</span>
    </div>`;
}

try {
  const raw = document.getElementById("dashboard-data").textContent;
  DATA = JSON.parse(raw);
  if (!DATA.snapshots || DATA.snapshots.length === 0) {
    throw new Error("No snapshots found in data");
  }
  setupPeriodSelector();
} catch (err) {
  showError(err);
}
</script>
</body>
